aid: cars24
name: Cars24
description: >-
  Cars24 (CARS24 Services Private Limited) is one of India's largest auto-tech
  companies and an online marketplace for buying and selling used cars, operating
  across India, the UAE, and Australia. Founded in 2015 and headquartered in
  Gurgaon, Haryana, Cars24 is an RBI-registered NBFC that combines a used-car
  transaction platform with financing, insurance, and vehicle-management services.
  Its offerings include buying and selling pre-owned cars with 300+ point
  inspections, fixed transparent pricing, warranties, and doorstep delivery;
  AI-driven used-car valuation; new-car discovery; traffic challan checking and
  payment; pre-delivery inspections across 220+ cities; vehicle history and
  service-history reports; car scrapping; FASTag recharge; and used-car loans,
  loan-against-car, and personal-loan products through Bikes24, Insure24, and
  related brands. Cars24 is backed by SoftBank Vision Fund and 500 Global. It is
  a consumer platform and does not publish a public developer API; this profile
  captures its identity, agent-facing llms.txt, and security posture.
